<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="100%" height="100%" style="background: linear-gradient(145deg, #0d131f 0%, #151d2e 50%, #0d1527 100%); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="140" x2="1100" y2="140" stroke-dasharray="6,6" />
    <line x1="0" y1="280" x2="1100" y2="280" stroke-dasharray="6,6" />
    <line x1="0" y1="430" x2="1100" y2="430" stroke-dasharray="6,6" />
    <line x1="0" y1="580" x2="1100" y2="580" stroke-dasharray="6,6" />
    <line x1="550" y1="80" x2="550" y2="800" stroke-dasharray="6,6" />
  </g>

  <!-- Title Header -->
  <g transform="translate(550, 48)" text-anchor="middle">
    <rect x="-320" y="-30" width="640" height="54" rx="27" fill="url(#primary-glow)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text y="4" fill="url(#header-grad)" font-size="20" font-weight="800" letter-spacing="1.5">TROPICALIACRAFT NETWORK — ARQUITETURA DE SERVIDOR</text>
    <text y="40" fill="#94a3b8" font-size="12" font-weight="500">Cross-Play Java &amp; Bedrock • AWS EC2 &amp; EBS • Single Sign-On (Argon2id + SQLite) • Daemon Go/Bun</text>
  </g>

  <!-- TOP LAYER: CLIENTS / JOGADORES -->
  <g transform="translate(550, 110)">
    <!-- Central Pill -->
    <rect x="-190" y="0" width="380" height="56" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)" />
    <circle cx="-150" cy="28" r="14" fill="#38bdf8" fill-opacity="0.2" />
    <text x="-150" y="33" text-anchor="middle" font-size="14">🎮</text>
    <text x="-120" y="27" fill="#f8fafc" font-size="15" font-weight="700">JOGADORES &amp; CLIENTES</text>
    <text x="-120" y="44" fill="#94a3b8" font-size="11">Ecossistema Multiplataforma Integrado</text>
  </g>

  <!-- BRANCH LINES TO PROTOCOLS -->
  <path d="M 450 166 L 450 190 L 290 190 L 290 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 650 166 L 650 190 L 810 190 L 810 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- PROTOCOL BOXES -->
  <!-- Java Client Box -->
  <g transform="translate(160, 220)">
    <rect width="260" height="74" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="14" y="14" width="46" height="46" rx="8" fill="#10b981" fill-opacity="0.15" />
    <text x="37" y="43" text-anchor="middle" font-size="22">☕</text>
    <text x="70" y="34" fill="#f8fafc" font-size="15" font-weight="700">Minecraft Java</text>
    <text x="70" y="52" fill="#34d399" font-size="12" font-weight="600">Porta TCP: 25565</text>
    <text x="70" y="66" fill="#94a3b8" font-size="10">PC Windows / Linux / macOS</text>
  </g>

  <!-- Bedrock Client Box -->
  <g transform="translate(680, 220)">
    <rect width="260" height="74" rx="12" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="14" y="14" width="46" height="46" rx="8" fill="#f59e0b" fill-opacity="0.15" />
    <text x="37" y="43" text-anchor="middle" font-size="22">📱</text>
    <text x="70" y="34" fill="#f8fafc" font-size="15" font-weight="700">Minecraft Bedrock</text>
    <text x="70" y="52" fill="#fbbf24" font-size="12" font-weight="600">Porta UDP: 19132</text>
    <text x="70" y="66" fill="#94a3b8" font-size="10">Android, iOS, Xbox, Switch, PS5</text>
  </g>

  <!-- GEYSER + FLOODGATE TRANSLATOR -->
  <path d="M 810 294 L 810 320" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />

  <g transform="translate(680, 325)">
    <rect width="260" height="68" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="1.5" />
    <text x="130" y="26" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">GeyserMC + Floodgate</text>
    <text x="130" y="44" text-anchor="middle" fill="#cbd5e1" font-size="11">Tradução de Pacotes UDP → TCP</text>
    <text x="130" y="58" text-anchor="middle" fill="#94a3b8" font-size="10">Autenticação Xbox Live (key.pem)</text>
  </g>

  <!-- CONNECTIONS TO AWS PERIMETER -->
  <!-- From Java Box -->
  <path d="M 290 294 L 290 420 L 460 420" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <!-- From Geyser Box -->
  <path d="M 810 393 L 810 420 L 640 420" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)" />

  <!-- AWS ENCLOSURE / PERIMETER -->
  <g transform="translate(90, 420)">
    <!-- Big Boundary Box -->
    <rect width="920" height="390" rx="20" fill="url(#aws-grad)" stroke="#ff9900" stroke-width="1.5" stroke-opacity="0.6" filter="url(#shadow)" />
    
    <!-- AWS Badge -->
    <g transform="translate(25, -16)">
      <rect width="360" height="32" rx="8" fill="#ff9900" />
      <text x="180" y="21" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800" letter-spacing="0.5">☁️ AWS INFRASTRUCTURE (EC2 &amp; EBS VOLUMES)</text>
    </g>

    <!-- Caddy Reverse Proxy Island -->
    <g transform="translate(330, 26)">
      <rect width="260" height="52" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="130" y="23" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">🔒 Caddy Server v2</text>
      <text x="130" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">SSL/TLS Automático Let's Encrypt (Porta 443/80)</text>
    </g>

    <!-- Arrows from Caddy to Landing & Minecraft Core -->
    <path d="M 390 78 L 390 100 L 230 100 L 230 115" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />
    <path d="M 530 78 L 530 100 L 690 100 L 690 115" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />

    <!-- SUB-CARD: LANDING PAGE -->
    <g transform="translate(60, 120)">
      <rect width="340" height="100" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="1.2" />
      <rect x="14" y="14" width="38" height="38" rx="8" fill="#dd0031" fill-opacity="0.15" />
      <text x="33" y="39" text-anchor="middle" font-size="20">🅰️</text>
      <text x="62" y="32" fill="#f8fafc" font-size="14" font-weight="700">LANDING PAGE WEB</text>
      <text x="62" y="48" fill="#f43f5e" font-size="11" font-weight="600">Angular 20 Zoneless + SSG + Tailwind</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">• Modal de Conta, Registro e Troca de Senha</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">• Upload de Skin PNG &amp; Live Map (Pl3xMap)</text>
    </g>

    <!-- SUB-CARD: MINECRAFT CORE -->
    <g transform="translate(520, 120)">
      <rect width="340" height="100" rx="12" fill="#0f172a" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="1.2" />
      <rect x="14" y="14" width="38" height="38" rx="8" fill="#10b981" fill-opacity="0.15" />
      <text x="33" y="39" text-anchor="middle" font-size="20">🧱</text>
      <text x="62" y="32" fill="#f8fafc" font-size="14" font-weight="700">MINECRAFT CORE SERVER</text>
      <text x="62" y="48" fill="#34d399" font-size="11" font-weight="600">PaperMC / Purpur • JDK 21 / 25</text>
      <text x="16" y="74" fill="#94a3b8" font-size="11">• 20 TPS estáveis (Aikar's Flags com G1GC/ZGC)</text>
      <text x="16" y="90" fill="#94a3b8" font-size="11">• SkinsRestorer, LuckPerms RBAC, GriefPrevention</text>
    </g>

    <!-- DOWN ARROWS TO CONTROL PLANE -->
    <path d="M 230 220 L 230 252" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)" />
    <text x="240" y="240" fill="#38bdf8" font-size="10" font-weight="600">REST API / JWT</text>

    <path d="M 690 220 L 690 252" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-emerald)" />
    <text x="700" y="240" fill="#10b981" font-size="10" font-weight="600">RCON / FIFO Socket IPC</text>

    <!-- DAEMON & CONTROL PLANE (HERO BOX) -->
    <g transform="translate(40, 255)">
      <rect width="840" height="118" rx="14" fill="#0b1120" stroke="#10b981" stroke-width="1.6" filter="url(#shadow)" />
      
      <!-- Top Title Bar -->
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 826 0 C 833.73 0 840 6.27 840 14 L 840 32 L 0 32 Z" fill="#10b981" fill-opacity="0.15" />
      <text x="20" y="22" fill="#34d399" font-size="13" font-weight="800">⚡ CONTROL PLANE &amp; DAEMON API (Go &amp; Bun Microservice + Systemd Supervisor)</text>

      <!-- 4 Columns of Features -->
      <!-- Col 1: Auth & SQLite -->
      <g transform="translate(20, 48)">
        <text y="0" fill="#f8fafc" font-size="12" font-weight="700">🔐 Auth &amp; Banco Transacional</text>
        <text y="18" fill="#94a3b8" font-size="10.5">• Criptografia de senhas em <tspan fill="#38bdf8" font-weight="600">Argon2id</tspan></text>
        <text y="34" fill="#94a3b8" font-size="10.5">• Sessões JWT com tokens <tspan fill="#38bdf8">tpp1.*</tspan></text>
        <text y="50" fill="#94a3b8" font-size="10.5">• Banco <tspan fill="#10b981" font-weight="700">SQLite (tropicalia.db)</tspan> ACID</text>
      </g>

      <!-- Col 2: Nick Linker & Chat Code -->
      <g transform="translate(230, 48)">
        <text y="0" fill="#f8fafc" font-size="12" font-weight="700">💬 Account Linker Anti-Spoofing</text>
        <text y="18" fill="#94a3b8" font-size="10.5">• Código de posse no chat: <tspan fill="#f59e0b" font-weight="600">TC-XXXXXX</tspan></text>
        <text y="34" fill="#94a3b8" font-size="10.5">• Watchdog de logs captura in-game</text>
        <text y="50" fill="#94a3b8" font-size="10.5">• Vínculo permanente Nick ↔ E-mail</text>
      </g>

      <!-- Col 3: Skins Engine -->
      <g transform="translate(440, 48)">
        <text y="0" fill="#f8fafc" font-size="12" font-weight="700">🎨 Skin Engine Automático</text>
        <text y="18" fill="#94a3b8" font-size="10.5">• Upload PNG (Classic &amp; Slim)</text>
        <text y="34" fill="#94a3b8" font-size="10.5">• Integração com <tspan fill="#38bdf8">SkinsRestorer</tspan></text>
        <text y="50" fill="#94a3b8" font-size="10.5">• Disparo em tempo real via RCON</text>
      </g>

      <!-- Col 4: DevOps & Systemd -->
      <g transform="translate(640, 48)">
        <text y="0" fill="#f8fafc" font-size="12" font-weight="700">🛡️ Supervisor &amp; Sandboxing</text>
        <text y="18" fill="#94a3b8" font-size="10.5">• <tspan fill="#38bdf8">ensure-java</tspan>: JDK 21 / 25 Adoptium</text>
        <text y="34" fill="#94a3b8" font-size="10.5">• Systemd: <tspan fill="#10b981">NoNewPrivileges</tspan> ativo</text>
        <text y="50" fill="#94a3b8" font-size="10.5">• Comunicação via <tspan fill="#f59e0b">FIFO Unix Sockets</tspan></text>
      </g>
    </g>
  </g>
</svg>
