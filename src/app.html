<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="author" content="Gustavo Lara" />


	<!-- Preload LCP Hero Avatar -->
	<link rel="preload" as="image" href="%sveltekit.assets%/assets/img/avatar/perfil-transparente.webp" type="image/webp" fetchpriority="high" />

	<!-- Google Fonts: Async Non-Render-Blocking -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap">
	</noscript>

	<meta name="theme-color" content="#f6f5f2" />
	<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
	<link rel="sitemap" type="application/xml" href="/sitemap.xml" />
	<link rel="alternate" type="text/plain" title="LLM summary" href="/llms.txt" />

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
